<script>
// ---- js/lighting.js ----
'use strict';
// ------------------------------------------------------------
//  Licht: Dunkelheit in halber Auflösung, Bayer-gerastert
//  (pixelige Lichtkegel), Taschenlampe mit Raycast-Schatten.
// ------------------------------------------------------------
const Lighting = (function () {
  const LW = VIEW_W / 2, LH = VIEW_H / 2;
  let cv, ctx;
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
  const LEVELS = 7;
  const DARK = [4, 4, 11];

  function init() { [cv, ctx] = mkCanvas(LW, LH, true); }

  function flashPoly(world, ox, oy, ang, half, len) {
    const pts = [];
    const n = 44;
    for (let i = 0; i <= n; i++) {
      const a = ang - half + (2 * half * i) / n;
      const dx = Math.cos(a), dy = Math.sin(a);
      let d = 0, hit = false, extra = 0;
      while (d < len) {
        d += 3;
        const x = ox + dx * d, y = oy + dy * d;
        if (!hit && world.opaqueAt(Math.floor(x / TS), Math.floor(y / TS))) { hit = true; }
        if (hit) { extra += 3; if (extra > 12) break; }
      }
      pts.push([ox + dx * Math.min(d, len), oy + dy * Math.min(d, len)]);
    }
    return pts;
  }

  function render(main, world, cam, player, t, opts) {
    const amb0 = world.theme.ambient;
    let amb = U.clamp(amb0 + (opts.darkBoost || 0), 0, 0.995) * (opts.brightness || 1);
    if (world.theme.outdoor) amb *= 1 - Game.lightning * 0.85;
    amb = U.clamp(amb, 0, 1);
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, LW, LH);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, LW, LH);
    ctx.globalCompositeOperation = 'destination-out';
    const flick = opts.flicker || 0;
    for (const L of world.lights) {
      if (!world.lightOn(L)) continue;
      let f = 1;
      if (L.flicker) f += (Math.sin(t * 9 + L.seed) + Math.sin(t * 23 + L.seed * 2)) * 0.5 * L.flicker;
      if (flick && L.obj && L.obj.def.light && L.obj.def.light.power) f *= (Math.random() < flick ? 0.1 : 1);
      const r = (L.r * f) / 2;
      const sx = (L.x - cam.x) / 2, sy = (L.y - cam.y) / 2;
      if (sx < -r || sy < -r || sx > LW + r || sy > LH + r || r <= 0) continue;
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
      g.addColorStop(0, 'rgba(0,0,0,' + L.i + ')');
      g.addColorStop(0.5, 'rgba(0,0,0,' + (L.i * 0.6).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
    }
    // Zusatzlichter (Effekte, Streichholz)
    (opts.extra || []).forEach((L) => {
      const sx = (L.x - cam.x) / 2, sy = (L.y - cam.y) / 2, r = L.r / 2;
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
      g.addColorStop(0, 'rgba(0,0,0,' + L.i + ')'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
    });
    let poly = null;
    if (player && !player.hidden) {
      // eigene Aura
      const px = (player.x - cam.x) / 2, py = (player.y - 8 - cam.y) / 2;
      const ga = ctx.createRadialGradient(px, py, 0, px, py, 15);
      ga.addColorStop(0, 'rgba(0,0,0,0.42)'); ga.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = ga; ctx.beginPath(); ctx.arc(px, py, 15, 0, TAU); ctx.fill();
      if (player.flashLit()) {
        const ox = player.x + Math.cos(player.aim) * 4, oy = player.y - 7 + Math.sin(player.aim) * 3;
        let len = 132, inten = 1;
        if (player.battery < 15) { len = 100; if (Math.random() < 0.12) inten = 0.25; }
        if (player.battery < 5) { len = 75; if (Math.random() < 0.3) inten = 0.1; }
        poly = flashPoly(world, ox, oy, player.aim, 0.42, len);
        const cx = (ox - cam.x) / 2, cy = (oy - cam.y) / 2;
        const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, len / 2);
        g.addColorStop(0, 'rgba(0,0,0,' + inten + ')');
        g.addColorStop(0.7, 'rgba(0,0,0,' + (0.85 * inten).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        poly.forEach(([x, y]) => ctx.lineTo((x - cam.x) / 2, (y - cam.y) / 2));
        ctx.closePath(); ctx.fill();
      }
    }
    // Rastern
    const img = ctx.getImageData(0, 0, LW, LH);
    const d = img.data;
    for (let y = 0; y < LH; y++) {
      for (let x = 0; x < LW; x++) {
        const i = (y * LW + x) * 4;
        const a = (d[i + 3] / 255) * amb;
        const q = Math.min(LEVELS, Math.floor(a * LEVELS + BAYER[((y & 3) << 2) | (x & 3)])) / LEVELS;
        d[i] = DARK[0]; d[i + 1] = DARK[1]; d[i + 2] = DARK[2];
        d[i + 3] = q * 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    main.drawImage(cv, 0, 0, VIEW_W, VIEW_H);

    // Warmes Leuchten (additiv)
    main.save();
    main.globalCompositeOperation = 'lighter';
    for (const L of world.lights) {
      if (L.moon || !world.lightOn(L)) continue;
      const sx = L.x - cam.x, sy = L.y - cam.y;
      const r = L.r * 0.8;
      if (sx < -r || sy < -r || sx > VIEW_W + r || sy > VIEW_H + r) continue;
      const f = L.flicker ? 1 + Math.sin(t * 11 + L.seed) * L.flicker : 1;
      const g = main.createRadialGradient(sx, sy, 0, sx, sy, r * f);
      const [cr, cg, cb] = L.c;
      g.addColorStop(0, 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (0.13 * L.i).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0)');
      main.fillStyle = g;
      main.beginPath(); main.arc(sx, sy, r * f, 0, TAU); main.fill();
    }
    if (poly) {
      const ox = player.x - cam.x, oy = player.y - 7 - cam.y;
      const g = main.createRadialGradient(ox, oy, 0, ox, oy, 120);
      g.addColorStop(0, 'rgba(255,230,170,0.10)'); g.addColorStop(1, 'rgba(255,230,170,0)');
      main.fillStyle = g;
      main.beginPath(); main.moveTo(ox, oy);
      poly.forEach(([x, y]) => main.lineTo(x - cam.x, y - cam.y));
      main.closePath(); main.fill();
    }
    main.restore();
    return poly;
  }

  // Liegt ein Punkt im Lichtkegel?
  function inCone(player, x, y, world) {
    if (!player.flashLit()) return false;
    const ox = player.x, oy = player.y - 7;
    const d = Math.hypot(x - ox, y - oy);
    if (d > 128) return false;
    const a = Math.atan2(y - oy, x - ox);
    if (Math.abs(U.angDiff(player.aim, a)) > 0.45) return false;
    return world.los(ox, oy, x, y);
  }

  return { init, render, inCone };
})();
</script>
<script>
// ---- js/entities.js ----
'use strict';
// ------------------------------------------------------------
//  Figuren mit Verhalten: Spielerin, Zählerin, Kriecher, Schemen
// ------------------------------------------------------------
class Player {
  constructor() {
    this.x = 0; this.y = 0; this.dir = 'down'; this.frame = 0; this.animT = 0;
    this.hp = 100; this.sanity = 100; this.stamina = 100; this.battery = 100;
    this.flashOn = false; this.hidden = null;
    this.aim = Math.PI / 2; this.stepT = 0; this.hurtT = 0; this.exhausted = false;
    this.breath = 1; this.kx = 0; this.ky = 0; this.moving = false; this.mode = 'walk';
    this.emptyWarned = false;
  }
  hasLamp() { return !!Game.inv.taschenlampe; }
  flashLit() { return this.flashOn && this.hasLamp() && this.battery > 0 && !this.hidden; }
  blocked(x, y) { return Game.world.rectBlocked(x - 4, y - 4, 8, 5); }
  move(dx, dy) {
    if (dx) {
      const nx = this.x + dx;
      if (!this.blocked(nx, this.y)) this.x = nx;
      else if (!dy) {
        for (let off = 1; off <= 7; off++) {
          let done = false;
          for (const s of [-1, 1]) {
            if (!this.blocked(nx, this.y + off * s) && !this.blocked(this.x, this.y + s)) { this.y += s * Math.min(1, Math.abs(dx) * 1.5); done = true; break; }
          }
          if (done) break;
        }
      }
    }
    if (dy) {
      const ny = this.y + dy;
      if (!this.blocked(this.x, ny)) this.y = ny;
      else if (!dx) {
        for (let off = 1; off <= 7; off++) {
          let done = false;
          for (const s of [-1, 1]) {
            if (!this.blocked(this.x + off * s, ny) && !this.blocked(this.x + s, this.y)) { this.x += s * Math.min(1, Math.abs(dy) * 1.5); done = true; break; }
          }
          if (done) break;
        }
      }
    }
  }
  update(dt, game) {
    this.hurtT = Math.max(0, this.hurtT - dt);
    if (this.hidden) { this.moving = false; this.stamina = Math.min(100, this.stamina + 25 * dt); return; }
    let ix = 0, iy = 0;
    if (game.canControl()) {
      if (Input.held('left')) ix -= 1;
      if (Input.held('right')) ix += 1;
      if (Input.held('up')) iy -= 1;
      if (Input.held('down')) iy += 1;
    }
    const moving = ix !== 0 || iy !== 0;
    const sneak = Input.held('sneak');
    let sprint = Input.held('sprint') && !sneak && !this.exhausted && moving;
    let speed = sneak ? 30 : sprint ? 92 : 55;
    if (this.hp < 30) speed *= 0.85;
    this.mode = !moving ? 'still' : sneak ? 'sneak' : sprint ? 'sprint' : 'walk';
    if (sprint) {
      this.stamina -= 30 * dt;
      if (this.stamina <= 0) { this.stamina = 0; this.exhausted = true; Sound.play('gasp'); }
    } else {
      this.stamina = Math.min(100, this.stamina + (moving ? 16 : 26) * dt);
      if (this.exhausted && this.stamina > 35) this.exhausted = false;
    }
    if (moving) {
      if (ix && iy) {
        const d = U.dirVec(this.dir);
        if (!((d[0] === ix) || (d[1] === iy))) this.dir = ix < 0 ? 'left' : 'right';
      } else if (ix) this.dir = ix < 0 ? 'left' : 'right';
      else this.dir = iy < 0 ? 'up' : 'down';
      const len = Math.hypot(ix, iy);
      this.move((ix / len) * speed * dt, (iy / len) * speed * dt);
      this.animT += dt * speed * 0.13;
      this.frame = Math.floor(this.animT) % 4;
      this.stepT -= dt * speed / 55;
      if (this.stepT <= 0) {
        this.stepT = 0.38;
        const surf = game.world.surfaceAt(this.x, this.y);
        Sound.play('step', surf, sneak ? 0.35 : sprint ? 1.4 : 0.9);
        game.noise(this.x, this.y, sneak ? 0 : sprint ? 150 : 62, 'step');
      }
    } else { this.frame = 0; this.animT = 0.99; }
    if (this.kx || this.ky) {
      this.move(this.kx * dt, this.ky * dt);
      this.kx *= Math.pow(0.02, dt); this.ky *= Math.pow(0.02, dt);
      if (Math.abs(this.kx) < 2 && Math.abs(this.ky) < 2) { this.kx = this.ky = 0; }
    }
    // Lampe zielt weich in Blickrichtung
    const target = U.dirAngle(this.dir) + Math.sin(game.time * 1.7) * 0.03;
    this.aim += U.angDiff(this.aim, target) * Math.min(1, dt * 12);
    if (this.flashLit()) {
      this.battery = Math.max(0, this.battery - 0.45 * dt);
      if (this.battery <= 0 && !this.emptyWarned) {
        this.emptyWarned = true;
        Sound.play('click');
        UI.toast(Game.inv.batterie ? 'Die Batterie ist leer. [R] wechseln.' : 'Die Batterie ist leer.');
      }
    }
  }
  draw(ctx, cam, t) {
    if (this.hidden) return;
    if (this.hurtT > 0 && Math.floor(t * 20) % 2) return;
    Chars.person(ctx, this.x - cam.x, this.y - cam.y, this.dir, this.frame, 'mara');
    // Lampe in der Hand
    if (this.hasLamp()) {
      const [dx, dy] = U.dirVec(this.dir);
      const hx = Math.round(this.x - cam.x + dx * 5 + (this.dir === 'down' ? 4 : this.dir === 'up' ? -4 : 0));
      const hy = Math.round(this.y - cam.y - 7 + dy * 2);
      G.R(ctx, hx, hy, 2, 2, C.st4);
      if (this.flashLit()) G.P(ctx, hx + (dx > 0 ? 1 : 0), hy + (dy > 0 ? 1 : 0), C.yl5);
    }
  }
}

// ------------------------------------------------------------
//  Die Zählerin
// ------------------------------------------------------------
class Stalker {
  constructor() { this.reset(); }
  reset() {
    this.map = null; this.x = 0; this.y = 0; this.dir = 'down'; this.state = 'gone';
    this.path = null; this.pathT = 0; this.target = null; this.timer = 0;
    this.count = 1; this.countT = 0; this.animT = 0; this.frame = 0;
    this.lastSeen = null; this.lostT = 0; this.vanishT = 20; this.relocT = 35;
    this.follow = null; this.followT = 0; this.seenHide = false; this.screamT = 0;
    this.stepT = 0; this.twitch = 0; this.speedMul = 1; this.searchNear = 0;
  }
  present(world) { return this.state !== 'gone' && this.map === world.id; }
  place(world, tx, ty, state) {
    this.map = world.id; this.x = tx * TS + 8; this.y = ty * TS + 12;
    this.state = state || 'wander'; this.path = null; this.timer = 0; this.lostT = 0;
    if (this.state === 'wander') this.count = 1;
  }
  spawnFar(world, player) {
    const p = world.randomFloor({ x: player.x, y: player.y }, 220, true);
    if (p) { this.place(world, p[0], p[1], 'wander'); return true; }
    return false;
  }
  vanish(t) { this.state = 'gone'; this.vanishT = t || U.rand(25, 40); this.path = null; this.follow = null; }
  canSee(game) {
    const p = game.player;
    if (p.hidden) return false;
    const d = Math.hypot(p.x - this.x, p.y - this.y);
    let vis = 92;
    if (p.flashLit()) vis = 190;
    else if (game.world.lightAt(p.x, p.y - 8) > 0.45) vis = 150;
    if (p.mode === 'sneak' && !p.flashLit()) vis *= 0.6;
    if (d > vis) return false;
    // Blickrichtung grob beachten (hinter ihr sieht sie schlechter)
    const [fx, fy] = U.dirVec(this.dir);
    const dot = ((p.x - this.x) * fx + (p.y - this.y) * fy) / (d || 1);
    if (dot < -0.3 && d > 40 && this.state !== 'chase') return false;
    return game.world.los(this.x, this.y - 24, p.x, p.y - 10);
  }
  setPath(world, tx, ty) {
    this.path = world.findPath(Math.floor(this.x / TS), Math.floor(this.y / TS), tx, ty, true);
    this.target = [tx, ty];
  }
  step(world, speed, dt) {
    if (!this.path || !this.path.length) return true;
    const [nx, ny] = this.path[0];
    const gx = nx * TS + 8, gy = ny * TS + 12;
    const dx = gx - this.x, dy = gy - this.y;
    const d = Math.hypot(dx, dy);
    // Türen öffnen
    for (const o of world.grid[ny * world.w + nx]) {
      if ((o.type === 'door') && !o.st.open && !(o.p.locked && !o.st.unlocked) && o.orient !== 'exit') {
        o.st.open = true; world.invalidateNav(); Sound.play('door');
      }
    }
    if (d < 2) { this.path.shift(); return !this.path.length; }
    const m = Math.min(d, speed * dt);
    this.x += (dx / d) * m; this.y += (dy / d) * m;
    this.face(dx, dy);
    return false;
  }
  face(dx, dy) { if (Math.abs(dx) > Math.abs(dy)) this.dir = dx < 0 ? 'left' : 'right'; else if (dy) this.dir = dy < 0 ? 'up' : 'down'; }
  hear(x, y, r) {
    if (this.state === 'chase' || this.state === 'gone' || this.state === 'attack') return;
    if (Math.hypot(x - this.x, y - this.y) < r) {
      this.state = 'investigate'; this.lastSeen = { x, y }; this.path = null; this.timer = 0;
    }
  }
  startChase(game) {
    if (this.state !== 'chase') {
      if (this.screamT <= 0) { Sound.play('scream'); this.screamT = 12; game.fxText(this.x, this.y - 40, 'GEFUNDEN.', C.rd4, 2); game.shake(3, 0.5); }
      game.player.sanity = Math.max(0, game.player.sanity - 8);
    }
    this.state = 'chase'; this.lostT = 0;
  }
  attack(game) {
    const p = game.player;
    const dmg = p.hidden ? 50 : 40;
    if (p.hidden) { game.unhide(true); UI.toast('Sie hat dich aus dem Versteck gezerrt.'); }
    game.damage(dmg, 'stalker', this.x, this.y);
    p.sanity = Math.max(0, p.sanity - 18);
    game.fxText(this.x, this.y - 40, '...eins.', C.bn2, 2.5);
    this.vanish();
  }
  update(dt, game) {
    const w = game.world, p = game.player;
    this.screamT -= dt;
    this.animT += dt * (this.state === 'chase' ? 9 : 4);
    this.frame = Math.floor(this.animT);
    if (Math.random() < dt * 0.6) this.twitch = 0.12;
    this.twitch = Math.max(0, this.twitch - dt);
    const d = Math.hypot(p.x - this.x, p.y - this.y);
    const sees = this.canSee(game);
    // Zählen
    if (this.state !== 'chase' && this.state !== 'scripted') {
      this.countT += dt;
      if (this.countT > 1.25) {
        this.countT = 0;
        if (d < 300) { game.fxText(this.x + U.rand(-6, 6), this.y - 40, U.numWord(this.count) + (this.count < 100 ? '...' : '.'), this.count > 90 ? C.rd4 : C.bn1, 1.6); if (d < 240) Sound.play('count', this.count); }
        this.count++;
        if (this.count > 100) {
          this.count = 1;
          this.state = 'investigate'; this.lastSeen = { x: p.x, y: p.y }; this.path = null;
          game.fxText(this.x, this.y - 48, 'ICH KOMME.', C.rd4, 2.5);
        }
      }
    }
    // Schritte
    this.stepT -= dt;
    if (this.stepT <= 0 && d < 220) { this.stepT = this.state === 'chase' ? 0.32 : 0.62; Sound.play('step', 'wood', U.clamp(1.6 - d / 140, 0.1, 1.4)); }

    if (this.state === 'scripted') return;
    if (sees && this.state !== 'attack' && !(this.state === 'idle' && this.afterIdle)) { this.lastSeen = { x: p.x, y: p.y }; this.startChase(game); }
    const sm = this.speedMul;
    switch (this.state) {
      case 'wander':
      case 'idle': {
        if (this.state === 'idle') {
          this.timer -= dt;
          if (this.timer <= 0) {
            const nx = this.afterIdle || 'wander';
            this.afterIdle = null;
            if (nx === 'chase') { this.lastSeen = { x: p.x, y: p.y }; this.startChase(game); }
            else this.state = nx;
            this.path = null;
          }
          break;
        }
        if (!this.path || !this.path.length) {
          const t = w.randomFloor(null, 0, true);
          if (t) this.setPath(w, t[0], t[1]);
          if (!this.path) { this.state = 'idle'; this.timer = 1; }
        }
        if (this.step(w, 28 * sm, dt)) { this.state = 'idle'; this.timer = U.rand(1, 3); this.path = null; }
        break;
      }
      case 'investigate': {
        this.pathT -= dt;
        if (!this.path || this.pathT <= 0) {
          this.pathT = 1.5;
          if (this.lastSeen) this.setPath(w, Math.floor(this.lastSeen.x / TS), Math.floor(this.lastSeen.y / TS));
        }
        if (!this.path || this.step(w, 44 * sm, dt)) { this.state = 'search'; this.timer = 5; this.path = null; }
        break;
      }
      case 'search': {
        this.timer -= dt;
        if (Math.random() < dt * 1.2) this.dir = U.pick(['up', 'down', 'left', 'right']);
        if (this.timer <= 0) { this.state = 'wander'; this.count = 1; }
        break;
      }
      case 'chase': {
        if (p.hidden) {
          if (this.seenHide) {
            const hb = p.hidden;
            this.pathT -= dt;
            if (!this.path || this.pathT <= 0) { this.pathT = 0.5; this.setPath(w, Math.floor(p.x / TS), Math.floor(p.y / TS)); }
            this.step(w, 64 * sm, dt);
            if (d < 18) { this.attack(game); return; }
            void hb;
          } else {
            this.state = 'investigate'; this.path = null;
          }
          break;
        }
        if (!sees) { this.lostT += dt; if (this.lostT > 2.8) { this.state = 'investigate'; this.path = null; break; } }
        else this.lostT = 0;
        const tx = sees ? p.x : this.lastSeen.x, ty = sees ? p.y : this.lastSeen.y;
        if (sees && w.clearLine(this.x, this.y - 4, tx, ty - 4, 5, true)) {
          const dx = tx - this.x, dy = ty - this.y, dd = Math.hypot(dx, dy) || 1;
          const m = 64 * sm * dt;
          this.x += (dx / dd) * m; this.y += (dy / dd) * m;
          this.face(dx, dy); this.path = null;
        } else {
          this.pathT -= dt;
          if (!this.path || this.pathT <= 0) { this.pathT = 0.35; this.setPath(w, Math.floor(tx / TS), Math.floor(ty / TS)); }
          this.step(w, 64 * sm, dt);
        }
        if (d < 11) this.attack(game);
        break;
      }
    }
  }
  draw(ctx, cam, t) {
    const sx = this.x - cam.x, sy = this.y - cam.y;
    G.disc(ctx, sx, sy, 6, 2, 'rgba(0,0,0,0.5)');
    Chars.counter(ctx, sx, sy, this.dir, this.frame, { raised: this.state === 'chase', twitch: this.twitch > 0, ghost: this.state === 'chase' && Math.sin(t * 13) > 0.6 });
  }
}

// ------------------------------------------------------------
//  Kriecher: blind, reagieren auf Geräusche
// ------------------------------------------------------------
class Crawler {
  constructor(tx, ty, opts) {
    this.hx = tx * TS + 8; this.hy = ty * TS + 12;
    this.x = this.hx; this.y = this.hy;
    this.dir = 'left'; this.state = 'idle'; this.timer = U.rand(1, 3);
    this.path = null; this.target = null; this.hurtCd = 0; this.root = !!(opts && opts.root);
    this.soundT = U.rand(2, 5); this.t = Math.random() * 10; this.pathT = 0;
  }
  setPath(w, tx, ty) { this.path = w.findPath(Math.floor(this.x / TS), Math.floor(this.y / TS), tx, ty, false, 2500); }
  step(w, speed, dt) {
    if (!this.path || !this.path.length) return true;
    const [nx, ny] = this.path[0];
    const gx = nx * TS + 8, gy = ny * TS + 12;
    const dx = gx - this.x, dy = gy - this.y, d = Math.hypot(dx, dy);
    if (d < 2) { this.path.shift(); return !this.path.length; }
    const m = Math.min(d, speed * dt);
    this.x += (dx / d) * m; this.y += (dy / d) * m;
    if (Math.abs(dx) > Math.abs(dy)) this.dir = dx < 0 ? 'left' : 'right'; else this.dir = dy < 0 ? 'up' : 'down';
    return false;
  }
  hear(x, y, r) {
    if (r <= 0 || this.state === 'retreat') return;
    if (Math.hypot(x - this.x, y - this.y) < r) {
      this.state = 'alert'; this.target = [Math.floor(x / TS), Math.floor(y / TS)]; this.pathT = 0;
    }
  }
  update(dt, game) {
    const w = game.world, p = game.player;
    this.t += dt; this.hurtCd -= dt;
    const d = Math.hypot(p.x - this.x, p.y - this.y);
    this.soundT -= dt;
    if (this.soundT <= 0 && d < 170) { this.soundT = U.rand(1.5, 4); Sound.play('crawler'); }
    switch (this.state) {
      case 'idle':
        this.timer -= dt;
        if (this.timer <= 0) {
          const tx = Math.floor(this.hx / TS) + U.randi(-5, 5), ty = Math.floor(this.hy / TS) + U.randi(-4, 4);
          if (w.navFree(tx, ty, false)) { this.setPath(w, tx, ty); this.state = 'wander'; }
          this.timer = U.rand(1, 3);
        }
        break;
      case 'wander':
        if (this.step(w, 15, dt)) { this.state = 'idle'; this.timer = U.rand(1.5, 4); }
        break;
      case 'alert':
        this.pathT -= dt;
        if (this.pathT <= 0 && this.target) { this.pathT = 0.6; this.setPath(w, this.target[0], this.target[1]); }
        if (this.step(w, this.root ? 40 : 50, dt)) { this.state = 'listen'; this.timer = 3; }
        break;
      case 'listen':
        this.timer -= dt;
        if (this.timer <= 0) this.state = 'idle';
        break;
      case 'retreat':
        this.timer -= dt;
        this.step(w, 30, dt);
        if (this.timer <= 0) { this.state = 'idle'; this.timer = 2; }
        break;
    }
    if (d < 12 && this.hurtCd <= 0 && !p.hidden) {
      this.hurtCd = 2.5;
      game.damage(this.root ? 18 : 22, 'crawler', this.x, this.y);
      p.sanity = Math.max(0, p.sanity - 10);
      this.state = 'retreat'; this.timer = 2.5;
      const t = w.randomFloor({ x: p.x, y: p.y }, 80, false);
      if (t) this.setPath(w, t[0], t[1]);
    }
  }
  draw(ctx, cam) {
    Chars.crawler(ctx, this.x - cam.x, this.y - cam.y, this.dir, this.t, { fast: this.state === 'alert', root: this.root });
  }
}

// ------------------------------------------------------------
//  Schemen – Halluzinationen bei wenig Verstand
// ------------------------------------------------------------
class Shade {
  constructor(x, y) { this.x = x; this.y = y; this.life = U.rand(3, 6); this.a = 0; this.fade = false; this.t = 0; }
  update(dt, game) {
    this.t += dt;
    const p = game.player;
    const d = Math.hypot(p.x - this.x, p.y - this.y);
    if (!this.fade) {
      this.a = Math.min(0.85, this.a + dt * 0.8);
      this.life -= dt;
      if (this.life <= 0 || d < 40 || Lighting.inCone(p, this.x, this.y - 12, game.world)) {
        this.fade = true; Sound.play('whisper');
      }
      if (d < 140) p.sanity = Math.max(0, p.sanity - dt * 1.5);
    } else this.a -= dt * 2.5;
    return this.a > 0 || !this.fade;
  }
  draw(ctx, cam, t) { Chars.shade(ctx, Math.round(this.x - cam.x), Math.round(this.y - cam.y), t, Math.max(0, this.a)); }
}

<script>
// ---- js/ui.js ----
'use strict';
// ------------------------------------------------------------
//  Oberfläche: Rahmen, Dialoge, Notizen, Inventar, Tagebuch,
//  Karte, Menüs, Zahlenschloss, Klavier. Alles in Pixelschrift.
// ------------------------------------------------------------
const UI = (function () {
  const R = G.R, P = G.P;
  const COL = { text: '#d8cfb8', dim: '#7d7889', hi: '#e8c46a', red: '#c8323a', ink: '#2a1b13', ink2: '#5a4630', bg: '#0b090e', line: '#3a3442' };
  let toasts = [];
  let banner = null;

  // ---------- Rahmen ----------
  function frame(ctx, x, y, w, h, opts = {}) {
    ctx.fillStyle = opts.bg || 'rgba(9,7,12,0.94)';
    ctx.fillRect(x, y, w, h);
    G.box(ctx, x, y, w, h, '#050407');
    G.box(ctx, x + 1, y + 1, w - 2, h - 2, '#4a4252');
    G.box(ctx, x + 2, y + 2, w - 4, h - 4, '#17131c');
    // Eckornamente
    const orn = opts.orn || '#8d7f66';
    [[x + 3, y + 3, 1, 1], [x + w - 4, y + 3, -1, 1], [x + 3, y + h - 4, 1, -1], [x + w - 4, y + h - 4, -1, -1]].forEach(([cx, cy, sx, sy]) => {
      P(ctx, cx, cy, orn); P(ctx, cx + sx, cy, orn); P(ctx, cx, cy + sy, orn); P(ctx, cx + sx * 2, cy, '#4a4252'); P(ctx, cx, cy + sy * 2, '#4a4252');
    });
    if (opts.title) {
      const tw = Font.width(opts.title) + 12;
      R(ctx, x + 8, y - 5, tw, 11, '#0b090e');
      G.box(ctx, x + 8, y - 5, tw, 11, '#4a4252');
      Font.draw(ctx, opts.title, x + 14, y - 5, COL.hi);
    }
  }
  function paper(ctx, x, y, w, h, seed) {
    R(ctx, x + 3, y + 3, w, h, 'rgba(0,0,0,0.5)');
    R(ctx, x, y, w, h, '#cdc2a3');
    G.speck(ctx, x, y, w, h, '#b9ad8c', Math.floor(w * h / 18), seed || 3);
    G.speck(ctx, x, y, w, h, '#ddd3b6', Math.floor(w * h / 30), (seed || 3) + 1);
    R(ctx, x, y, w, 1, '#e2d9be'); R(ctx, x, y, 1, h, '#e2d9be');
    R(ctx, x + w - 1, y, 1, h, '#9e9376'); R(ctx, x, y + h - 1, w, 1, '#9e9376');
    // Knick und Flecken
    G.dither(ctx, x + Math.floor(w / 2), y + 1, 1, h - 2, '#b0a586');
    G.dither(ctx, x + w - 30, y + 8, 18, 12, 'rgba(120,90,50,0.25)');
    // ausgefranster unterer Rand
    for (let i = 0; i < w; i += 3) if (U.hash(i, seed || 1, 5) < 0.5) R(ctx, x + i, y + h - 1, 2, 2, '#050407');
  }
  function keycap(ctx, x, y, label) {
    const w = Font.width(label) + 5;
    R(ctx, x, y, w, 10, '#2a2530'); R(ctx, x, y + 9, w, 1, '#0b090e'); R(ctx, x, y, w, 1, '#5a5262');
    Font.draw(ctx, label, x + 3, y - 1, COL.hi);
    return w;
  }

  // ---------- Toasts / Banner ----------
  function toast(text) { if (toasts.length && toasts[toasts.length - 1].text === text) return; toasts.push({ text, t: 0 }); }
  function showBanner(text, sub) { banner = { text, sub, t: 0 }; }
  function drawToasts(ctx, dt) {
    if (toasts.length) {
      const tt = toasts[0];
      tt.t += dt;
      const life = 2.6 + Font.len(tt.text) * 0.02;
      const a = tt.t < 0.2 ? tt.t / 0.2 : tt.t > life - 0.4 ? Math.max(0, (life - tt.t) / 0.4) : 1;
      const w = Font.width(tt.text) + 16;
      const x = Math.round(VIEW_W / 2 - w / 2), y = 8;
      ctx.globalAlpha = a;
      R(ctx, x, y, w, 15, 'rgba(8,6,10,0.88)'); G.box(ctx, x, y, w, 15, '#3a3442');
      R(ctx, x + 2, y + 2, 1, 11, COL.hi);
      Font.draw(ctx, tt.text, x + 8, y + 2, COL.text);
      ctx.globalAlpha = 1;
      if (tt.t > life) toasts.shift();
    }
    if (banner) {
      banner.t += dt;
      const b = banner, life = 3.6;
      const a = b.t < 0.8 ? b.t / 0.8 : b.t > life - 1 ? Math.max(0, (life - b.t)) : 1;
      ctx.globalAlpha = a;
      Font.draw(ctx, b.text, VIEW_W / 2, 40, COL.text, { align: 'center', scale: 2, shadow: '#050407' });
      const lw = Font.width(b.text) * 2;
      R(ctx, VIEW_W / 2 - lw / 2, 62, lw, 1, '#5a5060');
      if (b.sub) Font.draw(ctx, b.sub, VIEW_W / 2, 65, COL.dim, { align: 'center' });
      ctx.globalAlpha = 1;
      if (b.t > life) banner = null;
    }
  }

  // ---------- HUD ----------
  const HUD_ICONS = {
    heart: G.fromRows(['.rr.rr.', 'rRRrRRr', 'rRWRRRr', 'rRRRRRr', '.rRRRr.', '..rRr..', '...r...'], { r: C.rd1, R: C.rd4, W: C.rd5 }),
    eye: G.fromRows(['..ppp..', '.p...p.', 'p..W..p', 'p.WkW.p', 'p..W..p', '.p...p.', '..ppp..'], { p: C.pu4, W: C.bn3, k: C.ink }),
    lamp: G.fromRows(['.....yy', '....yYy', 'ggggyYy', 'gGGGyYy', 'ggggyYy', '....yYy', '.....yy'], { g: C.st2, G: C.st4, y: C.yl2, Y: C.yl4 }),
  };
  function bar(ctx, x, y, w, v, col, back) {
    R(ctx, x, y, w + 2, 5, '#050407');
    R(ctx, x + 1, y + 1, w, 3, back || '#1d1a22');

    ctx.drawImage(HUD_ICONS.heart, x, y);
    const hpLow = p.hp < 30 && Math.sin(game.time * 8) > 0;
    bar(ctx, x + 10, y + 1, 50, p.hp / 100, hpLow ? C.rd5 : C.rd3);
    ctx.drawImage(HUD_ICONS.eye, x, y + 9);
    bar(ctx, x + 10, y + 10, 50, p.sanity / 100, C.pu4);
    if (p.hasLamp()) {
      ctx.drawImage(HUD_ICONS.lamp, x, y + 18);
      const segs = Math.ceil(p.battery / 20);
      for (let i = 0; i < 5; i++) R(ctx, x + 11 + i * 7, y + 19, 6, 5, i < segs ? (p.battery < 20 ? C.rd4 : p.flashOn ? C.yl3 : C.yl1) : '#1d1a22');
      const nb = game.inv.batterie || 0;
      if (nb) Font.draw(ctx, 'x' + nb, x + 49, y + 16, COL.dim);
    }
    ctx.globalAlpha = 1;

  // ---------- Overlays ----------
  class Dialog {
    constructor(text, opts = {}) {
      this.who = opts.who || null;

      this.lines = Font.wrap(text, VIEW_W - 44);
      this.pages = [];
      for (let i = 0; i < this.lines.length; i += 4) this.pages.push(this.lines.slice(i, i + 4));
      this.page = 0; this.chars = 0; this.t = 0; this.blipT = 0;

    pageLen() { return this.pages[this.page].reduce((a, l) => a + Font.len(l), 0); }
    update(dt) {
      this.t += dt;

      if (this.chars < total) {
        const sp = Input.held('ok') ? this.speed * 3 : this.speed;
        const before = Math.floor(this.chars);
        this.chars = Math.min(total, this.chars + sp * dt);
        if (Math.floor(this.chars) !== before) { this.blipT -= 1; if (this.blipT <= 0) { Sound.play('blip'); this.blipT = 2; } }
        if (Input.hit('ok') && this.t > 0.15) this.chars = total;
      } else if (Input.hit('ok') || Input.hit('back')) {
        if (this.page < this.pages.length - 1) { this.page++; this.chars = 0; Sound.play('ui'); }
        else { this.done = true; }

    }
    draw(ctx) {
      const x = 10, h = 54, y = VIEW_H - h - 6, w = VIEW_W - 20;
      frame(ctx, x, y, w, h, { title: this.who });
      let left = this.chars;
      this.pages[this.page].forEach((l, i) => {

        Font.draw(ctx, l, x + 12, y + 6 + i * Font.LINE, this.color, { max: n });

  // Theos Wachsmalbilder
  function crayon(ctx, art, x, y, w, h) {
    R(ctx, x, y, w, h, '#ece6d4');
    G.speck(ctx, x, y, w, h, '#ddd5bf', 60, art);
    const rnd = U.rng(art * 977 + 13);
    const ln = (x0, y0, x1, y1, c, th = 2) => {
      for (let k = 0; k < th; k++) G.line(ctx, x + x0 + (rnd() * 2 - 1), y + y0 + k + (rnd() * 2 - 1), x + x1 + (rnd() * 2 - 1), y + y1 + k + (rnd() * 2 - 1), c);
    };
    const scrib = (cx, cy, rw, rh, c, n = 18) => { for (let i = 0; i < n; i++) ln(cx + (rnd() - 0.5) * rw, cy + (rnd() - 0.5) * rh, cx + (rnd() - 0.5) * rw, cy + (rnd() - 0.5) * rh, c, 1); };
    const stick = (cx, by, c, hh = 22, head = '#e0b896', hair) => {
      G.ring(ctx, x + cx, y + by - hh, 4, head); if (hair) scrib(cx, by - hh - 3, 8, 3, hair, 8);
      ln(cx, by - hh + 4, cx, by - 8, c); ln(cx, by - 8, cx - 4, by, c); ln(cx, by - 8, cx + 4, by, c);
      ln(cx - 6, by - hh + 9, cx + 6, by - hh + 9, c);
    };
    const B = '#1b1820', RD = '#c0302c', GR = '#3f8a3a', BL = '#3d5fa8', YL = '#e2b23a', BR = '#7a4a26', GY = '#7d7b80';
    if (art === 1) {
      for (let i = 0; i < 6; i++) { const tx = 8 + i * 22; ln(tx, 46, tx + 6, 30, GR); ln(tx + 6, 30, tx + 12, 46, GR); ln(tx + 6, 46, tx + 6, 52, BR); }
      ln(10, 14, 120, 14, B, 2); ln(60, 14, 62, 4, B); ln(90, 14, 96, 26, B); ln(40, 14, 34, 26, B);
      R(ctx, x + 20, y + 62, 40, 12, RD); G.ring(ctx, x + 28, y + 75, 3, B); G.ring(ctx, x + 52, y + 75, 3, B);
      stick(78, 78, BL, 18); stick(94, 78, YL, 20, undefined, '#3a2412'); stick(108, 78, BL, 14);
    } else if (art === 2) {
      ln(20, 50, 120, 50, BR, 3); ln(26, 52, 26, 70, BR); ln(114, 52, 114, 70, BR);
      for (let i = 0; i < 4; i++) G.ring(ctx, x + 36 + i * 20, y + 46, 4, GY);
      ln(118, 30, 118, 70, BR); ln(118, 50, 132, 50, BR);
      G.ring(ctx, x + 126, y + 30, 4, '#e0e0e0'); scrib(126, 40, 10, 26, B, 30);
      Font.draw(ctx, 'ihr platz', x + 10, y + 70, RD);
    } else if (art === 3) {
      ln(46, 10, 96, 10, BR, 3); ln(46, 10, 46, 76, BR, 3); ln(96, 10, 96, 76, BR, 3); ln(46, 76, 96, 76, BR, 3); ln(71, 10, 71, 76, BR, 2);
      scrib(71, 40, 4, 50, B, 20);
      R(ctx, x + 68, y + 30, 2, 2, '#f0f0f0'); R(ctx, x + 72, y + 30, 2, 2, '#f0f0f0'); P(ctx, x + 69, y + 31, RD); P(ctx, x + 73, y + 31, RD);
      Font.draw(ctx, 'nicht aufmachen', x + 24, y + 78, RD);
    } else if (art === 4) {
      for (let k = 0; k < 3; k++) {
        const cx = 20 + k * 40, cy = 40 + (k % 2) * 10;
        ln(cx, cy, cx + 22, cy, GY, 2); G.ring(ctx, x + cx + 26, y + cy - 1, 3, GY);
        ln(cx + 2, cy, cx - 2, cy + 10, GY); ln(cx + 8, cy, cx + 10, cy + 10, GY); ln(cx + 16, cy, cx + 14, cy + 10, GY); ln(cx + 22, cy, cx + 24, cy + 10, GY);
      }
      Font.draw(ctx, 'LEISE sein!', x + 30, y + 72, RD, { scale: 1 });
    } else if (art === 5) {
      G.disc(ctx, x + 70, y + 54, 34, 12, '#5a7fc0'); G.disc(ctx, x + 70, y + 54, 26, 8, '#3d5fa8');
      R(ctx, x + 67, y + 48, 6, 2, GY); R(ctx, x + 65, y + 50, 10, 6, GY);
      for (let i = 0; i < 7; i++) { const fx = 10 + i * 19; ln(fx, 40, fx, 26, GR); scrib(fx, 22, 8, 7, RD, 10); }
    } else if (art === 6) {
      stick(40, 74, '#e0e0e0', 22, undefined, B); stick(64, 74, RD, 20, undefined, '#3a2412');
      ln(34, 38, 48, 76, B, 2); ln(48, 38, 34, 76, B, 2);
      ln(48, 58, 56, 58, B);
      for (let j = 0; j < 3; j++) ln(100 + j, 8, 100 + j, 78, B);

    if (Input.hit('inv') && cur !== 'inv') return 'inv';

  class InventoryView {
    constructor() { this.sel = 0; this.t = 0; this.msg = null; this.msgT = 0; }
    items() { return Object.keys(ITEMS).filter((k) => Game.inv[k] > 0); }
    update(dt) {
      this.t += dt; this.msgT -= dt;
      const it = this.items();
      const cols = 5;
      if (Input.nav('right')) { this.sel = Math.min(it.length - 1, this.sel + 1); Sound.play('ui'); }
      if (Input.nav('left')) { this.sel = Math.max(0, this.sel - 1); Sound.play('ui'); }
      if (Input.nav('down')) { this.sel = Math.min(it.length - 1, this.sel + cols); Sound.play('ui'); }
      if (Input.nav('up')) { this.sel = Math.max(0, this.sel - cols); Sound.play('ui'); }
      this.sel = U.clamp(this.sel, 0, Math.max(0, it.length - 1));
      const sw = menuSwitch('inv');
      if (sw) { this.done = true; this.next = sw; return; }
      if (Input.hit('back') || (Input.hit('inv') && this.t > 0.1)) { this.done = true; Sound.play('back'); return; }
      if (Input.hit('ok') && it.length) {
        const id = it[this.sel];
        const r = Story.useItem(id);
        if (r && r.note) { this.done = true; this.next = { note: r.note }; return; }
        if (r && r.msg) { this.msg = r.msg; this.msgT = 2.5; }

  class JournalView {
    constructor() { this.col = 0; this.cat = 0; this.sel = 0; this.t = 0; this.scroll = 0; }
    cats() {
      const notes = Game.notes.filter((n) => NOTES[n].kind === 'note');
      const pages = Game.notes.filter((n) => NOTES[n].kind === 'page');
      const draws = Game.notes.filter((n) => NOTES[n].kind === 'drawing');
      return [
        { name: 'Aufgaben', list: null },
        { name: 'Notizen (' + notes.length + ')', list: notes },
        { name: 'Seiten (' + pages.length + '/4)', list: pages },
        { name: 'Bilder (' + draws.length + '/6)', list: draws },
      ];
    }
    update(dt) {
      this.t += dt;
      const cats = this.cats();
      const sw = menuSwitch('journal');
      if (sw) { this.done = true; this.next = sw; return; }
      if (Input.hit('back') || (Input.hit('journal') && this.t > 0.1)) { this.done = true; Sound.play('back'); return; }
      if (this.col === 0) {
        if (Input.nav('up')) { this.cat = (this.cat + cats.length - 1) % cats.length; this.sel = 0; Sound.play('ui'); }
        if (Input.nav('down')) { this.cat = (this.cat + 1) % cats.length; this.sel = 0; Sound.play('ui'); }
        if ((Input.nav('right') || Input.hit('ok')) && cats[this.cat].list && cats[this.cat].list.length) { this.col = 1; Sound.play('ui'); }
      } else {
        const list = cats[this.cat].list;
        if (Input.nav('up')) { this.sel = Math.max(0, this.sel - 1); Sound.play('ui'); }
        if (Input.nav('down')) { this.sel = Math.min(list.length - 1, this.sel + 1); Sound.play('ui'); }
        if (Input.nav('left')) { this.col = 0; Sound.play('ui'); }
        if (Input.hit('ok') && list.length) { this.done = true; this.next = { note: list[this.sel], back: 'journal' }; }
      }
    }

        Font.draw(ctx, c.name, x + 12, y + 10 + i * 14, s ? COL.hi : COL.dim);
      });
      R(ctx, x + 116, y + 8, 1, h - 16, '#2a2530');
      const px = x + 124, pw = w - 134;
      const c = cats[this.cat];
      if (!c.list) {
        const objs = Story.objectives();
        let yy = y + 10;
        objs.forEach((o) => {
          const lines = Font.wrap(o.text, pw - 14);
          R(ctx, px, yy + 2, 7, 7, '#050407'); G.box(ctx, px, yy + 2, 7, 7, o.done ? '#5a5060' : COL.hi);
          if (o.done) { G.line(ctx, px + 1, yy + 5, px + 3, yy + 7, '#8d7f66'); G.line(ctx, px + 3, yy + 7, px + 6, yy + 2, '#8d7f66'); }
          lines.forEach((l, i) => Font.draw(ctx, l, px + 12, yy + i * Font.LINE, o.done ? '#4e4a58' : (o.main ? COL.text : COL.dim)));

      } else if (!c.list.length) {

        const max = 13;
        const start = Math.max(0, Math.min(this.sel - 6, c.list.length - max));
        c.list.slice(start, start + max).forEach((id, k) => {

  class MapView {
    constructor() { this.t = 0; }
    update(dt) {
      this.t += dt;
      const sw = menuSwitch('map');
      if (sw) { this.done = true; this.next = sw; return; }
      if (Input.hit('back') || Input.hit('ok') || (Input.hit('map') && this.t > 0.1)) { this.done = true; Sound.play('back'); }
    }
    draw(ctx) {
      ctx.fillStyle = 'rgba(3,2,5,0.86)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      tabs(ctx, 2);
      const x = 16, y = 26, w = VIEW_W - 32, h = VIEW_H - 36;
      frame(ctx, x, y, w, h, { title: Game.world.name });
      const wd = Game.world;
      const s = Math.max(2, Math.min(6, Math.floor(Math.min((w - 20) / wd.w, (h - 30) / wd.h))));
      const ox = Math.round(x + w / 2 - (wd.w * s) / 2), oy = Math.round(y + 12 + (h - 30) / 2 - (wd.h * s) / 2);
      for (let ty = 0; ty < wd.h; ty++) for (let tx = 0; tx < wd.w; tx++) {
        if (!wd.seen[ty * wd.w + tx]) continue;
        const ch = wd.tileAt(tx, ty);
        let c;
        if (Tiles.isWall(ch)) c = '#5a5266';
        else if (ch === '~') c = '#1f3350';
        else if (ch === 'T' || ch === 't' || ch === 'o') c = '#14241a';
        else if (ch === ',' || ch === ';') c = '#1c2a1d';
        else if (ch === 'd') c = '#9a5a26';
        else if (Tiles.isSolid(ch)) c = '#2a2630';
        else c = '#221e2a';
        R(ctx, ox + tx * s, oy + ty * s, s, s, c);
      }
      wd.objects.forEach((o) => {
        if (!o.exists() || !wd.seen[o.y * wd.w + o.x]) return;
        let c = null;
        if (o.type === 'guestbook') c = C.yl4;
        else if (o.type === 'stairs' || o.type === 'ladder' || o.type === 'hatch') c = C.bl5;
        else if (o.type === 'door' && o.p.to) c = C.or4;
        else if (o.type === 'door' && o.p.locked && !o.st.unlocked) c = C.rd4;
        if (c) R(ctx, ox + o.x * s, oy + o.y * s, Math.max(2, s * o.w - 1), Math.max(2, s - 1), c);
      });
      const p = Game.player;
      if (Math.sin(this.t * 8) > -0.2) { R(ctx, ox + (p.x / TS) * s - 2, oy + (p.y / TS) * s - 2, 4, 4, C.rd5); }
      const ly = y + h - 14;
      R(ctx, x + 10, ly + 3, 5, 5, C.rd5); Font.draw(ctx, 'Ich', x + 18, ly, COL.dim);
      R(ctx, x + 44, ly + 3, 5, 5, C.yl4); Font.draw(ctx, 'Gästebuch', x + 52, ly, COL.dim);
      R(ctx, x + 112, ly + 3, 5, 5, C.bl5); Font.draw(ctx, 'Treppe', x + 120, ly, COL.dim);
      R(ctx, x + 162, ly + 3, 5, 5, C.rd4); Font.draw(ctx, 'verschlossen', x + 170, ly, COL.dim);
    }
  }

  class ListMenu {
    constructor(title, items, opts = {}) { this.title = title; this.items = items; this.sel = 0; this.t = 0; this.opts = opts; }
    update(dt) {
      this.t += dt;
      const n = this.items.length;
      if (Input.nav('up')) { this.sel = (this.sel + n - 1) % n; Sound.play('ui'); }
      if (Input.nav('down')) { this.sel = (this.sel + 1) % n; Sound.play('ui'); }
      const it = this.items[this.sel];
      if (it.adjust) {
        if (Input.nav('left')) { it.adjust(-1); Sound.play('ui'); }
        if (Input.nav('right')) { it.adjust(1); Sound.play('ui'); }
      }
      if (Input.hit('ok') && this.t > 0.1) {
        if (it.disabled) { Sound.play('locked'); return; }
        Sound.play('ok');
        if (it.adjust) it.adjust(1);
        else { this.result = it.id; this.done = true; }
      } else if (Input.hit('back') && this.t > 0.1) { this.result = 'back'; this.done = true; Sound.play('back'); }
    }
    draw(ctx) {
      if (!this.opts.noDim) { ctx.fillStyle = 'rgba(3,2,5,0.75)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H); }
      const w = this.opts.w || 180, h = 22 + this.items.length * 14;
      const x = Math.round(VIEW_W / 2 - w / 2), y = this.opts.y || Math.round(VIEW_H / 2 - h / 2);
      frame(ctx, x, y, w, h, { title: this.title });
      this.items.forEach((it, i) => {
        const s = i === this.sel;
        const yy = y + 12 + i * 14;
        if (s) { R(ctx, x + 6, yy - 1, w - 12, 12, 'rgba(232,196,106,0.1)'); if (Math.sin(this.t * 8) > -0.3) Font.draw(ctx, '▶', x + 10, yy, COL.hi); }
        Font.draw(ctx, it.label, x + 20, yy, it.disabled ? '#3e3a46' : s ? COL.hi : COL.text);
        if (it.value) Font.draw(ctx, it.value(), x + w - 12, yy, s ? COL.hi : COL.dim, { align: 'right' });
      });
    }
  }

  class ControlsView {
    constructor() { this.t = 0; }
    update(dt) { this.t += dt; if ((Input.hit('ok') || Input.hit('back')) && this.t > 0.15) { this.done = true; Sound.play('back'); } }
    draw(ctx) {
      ctx.fillStyle = 'rgba(3,2,5,0.85)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      const w = 300, h = 184, x = Math.round(VIEW_W / 2 - w / 2), y = 16;
      frame(ctx, x, y, w, h, { title: 'Steuerung' });
      const rows = [
        ['WASD / Pfeile', 'Gehen'], ['Shift', 'Rennen (laut!)'], ['Strg / C', 'Schleichen (leise)'],
        ['E / Leertaste', 'Untersuchen, benutzen, weiter'], ['F', 'Taschenlampe an/aus'], ['R', 'Batterie wechseln'],
        ['I / Tab', 'Inventar'], ['J', 'Tagebuch & Aufgaben'], ['M', 'Karte'], ['Esc', 'Pause'],
      ];
      rows.forEach(([k, v], i) => { Font.draw(ctx, k, x + 14, y + 12 + i * 12, COL.hi); Font.draw(ctx, v, x + 112, y + 12 + i * 12, COL.text); });
      Font.wrap('Licht beruhigt – aber es verrät dich. Wer rennt, wird gehört. In Schränken und unter Betten kann man sich verstecken.', w - 28)
        .forEach((l, i) => Font.draw(ctx, l, x + 14, y + 140 + i * 11, COL.dim));
    }
  }

  class CodeLock {
    constructor(title) { this.title = title || 'Tresor'; this.d = [0, 0, 0, 0]; this.i = 0; this.t = 0; this.shakeT = 0; }
    update(dt) {
      this.t += dt; this.shakeT -= dt;
      if (Input.nav('left')) { this.i = (this.i + 3) % 4; Sound.play('ui'); }
      if (Input.nav('right')) { this.i = (this.i + 1) % 4; Sound.play('ui'); }
      if (Input.nav('up')) { this.d[this.i] = (this.d[this.i] + 1) % 10; Sound.play('click'); }
      if (Input.nav('down')) { this.d[this.i] = (this.d[this.i] + 9) % 10; Sound.play('click'); }
      Input.typed.forEach((ch) => { if (ch >= '0' && ch <= '9') { this.d[this.i] = +ch; this.i = Math.min(3, this.i + 1); Sound.play('click'); } });
      if (Input.hit('back')) { this.result = null; this.done = true; Sound.play('back'); }
      else if (Input.hit('ok') && this.t > 0.15) { this.result = this.d.join(''); this.done = true; }
    }
    draw(ctx) {
      ctx.fillStyle = 'rgba(3,2,5,0.75)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      const w = 200, h = 112, x = Math.round(VIEW_W / 2 - w / 2), y = 40;
      frame(ctx, x, y, w, h, { title: this.title });
      R(ctx, x + 20, y + 16, w - 40, 56, '#1a1c20'); G.box(ctx, x + 20, y + 16, w - 40, 56, '#4a4e56');
      for (let k = 0; k < 4; k++) {
        const cx = x + 34 + k * 34, cy = y + 26;
        R(ctx, cx, cy, 24, 34, '#0b0c0e'); G.box(ctx, cx, cy, 24, 34, k === this.i ? COL.hi : '#3a3e45');
        R(ctx, cx + 1, cy + 1, 22, 3, 'rgba(255,255,255,0.05)');
        Font.draw(ctx, String((this.d[k] + 9) % 10), cx + 12, cy - 1, '#3a3e45', { align: 'center' });
        Font.draw(ctx, String(this.d[k]), cx + 12, cy + 8, '#d8cfb8', { align: 'center', scale: 2 });
        Font.draw(ctx, String((this.d[k] + 1) % 10), cx + 12, cy + 25, '#3a3e45', { align: 'center' });
        if (k === this.i && Math.sin(this.t * 6) > 0) { Font.draw(ctx, '↑', cx + 12, cy - 13, COL.hi, { align: 'center' }); }
      }
      Font.draw(ctx, '↑↓ Ziffer   ←→ Rad   E Öffnen   Esc Zurück', x + w / 2, y + h - 18, COL.dim, { align: 'center' });
    }
  }

  class PianoView {
    constructor(hasSheet) {
      this.keys = ['C', 'D', 'E', 'F', 'G', 'A', 'H', 'C2'];
      this.sel = 5; this.played = []; this.t = 0; this.hasSheet = hasSheet; this.flash = {}; this.solved = false; this.wrongT = 0;
    }
    press(i) {
      const n = this.keys[i];
      Sound.play('piano', n);
      this.flash[i] = 0.25;
      this.played.push(n);
      if (this.played.length > 8) this.played.shift();
      const target = Sound.LULLABY;
      if (this.played.length === 8 && this.played.every((v, k) => v === target[k])) { this.solved = true; this.doneT = 1.6; }
    }
    update(dt) {
      this.t += dt;
      for (const k in this.flash) this.flash[k] -= dt;
      if (this.solved) { this.doneT -= dt; if (this.doneT <= 0) { this.result = true; this.done = true; } return; }
      if (Input.nav('left')) { this.sel = (this.sel + 7) % 8; Sound.play('ui'); }
      if (Input.nav('right')) { this.sel = (this.sel + 1) % 8; Sound.play('ui'); }
      if (Input.hit('ok') && this.t > 0.15) this.press(this.sel);
      Input.typed.forEach((ch) => { if (ch >= '1' && ch <= '8') { this.sel = +ch - 1; this.press(this.sel); } });
      if (Input.hit('back')) { this.result = false; this.done = true; Sound.play('back'); }
    }
    draw(ctx) {
      ctx.fillStyle = 'rgba(3,2,5,0.78)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      const w = 300, h = 170, x = Math.round(VIEW_W / 2 - w / 2), y = 22;
      frame(ctx, x, y, w, h, { title: 'Klavier' });
      const kx = x + 30, ky = y + 46, kw = 30, kh = 74;
      R(ctx, kx - 6, ky - 8, kw * 8 + 12, kh + 14, '#121014');
      R(ctx, kx - 6, ky - 8, kw * 8 + 12, 2, '#3c3644');
      for (let i = 0; i < 8; i++) {
        const fl = this.flash[i] > 0;
        R(ctx, kx + i * kw, ky, kw - 2, kh, fl ? '#f5ecc8' : '#d8d0bc');
        R(ctx, kx + i * kw, ky + kh - 4, kw - 2, 4, '#a89f8a');
        if (i === this.sel) G.box(ctx, kx + i * kw - 1, ky - 1, kw, kh + 2, Math.sin(this.t * 6) > 0 ? COL.hi : '#8d7f66');
        const lbl = this.keys[i] === 'C2' ? 'C' : this.keys[i];
        Font.draw(ctx, lbl, kx + i * kw + kw / 2 - 1, ky + kh - 16, '#3a3632', { align: 'center' });
        Font.draw(ctx, String(i + 1), kx + i * kw + kw / 2 - 1, ky + kh + 4, COL.dim, { align: 'center' });
      }
      [0, 1, 3, 4, 5].forEach((i) => R(ctx, kx + i * kw + kw - 9, ky, 14, 44, '#141216'));
      const seq = this.played.map((n) => (n === 'C2' ? 'C' : n)).join(' ');
      Font.draw(ctx, seq || '...', x + w / 2, y + 14, this.solved ? COL.hi : COL.text, { align: 'center' });
      if (this.hasSheet) Font.draw(ctx, 'Theos Blatt:  a  C(hoch)  h  g  a  e  f  e', x + w / 2, y + 28, COL.dim, { align: 'center' });
      Font.draw(ctx, '←→ Taste   E spielen   1-8 direkt   Esc Zurück', x + w / 2, y + h - 14, COL.dim, { align: 'center' });
    }
  }

  return {
    COL, frame, paper, keycap, toast, showBanner, drawToasts, hud, prompt, crayon,
    Dialog, Choice, NoteView, InventoryView, JournalView, MapView, ListMenu, ControlsView, CodeLock, PianoView,
    clearToasts() { toasts = []; banner = null; },
  };
})();
</script>
<script>
// ---- js/scripts.js ----
'use strict';
// ------------------------------------------------------------
//  Geschichte & Skripte. Skripte sind Generatoren, die Befehle
//  "yielden" (Dialog, Auswahl, Warten, Notiz, Zahlenschloss ...).
// ------------------------------------------------------------
const say = (text, opts) => ({ cmd: 'say', text, opts });
const ask = (text, options, opts) => ({ cmd: 'choice', text, options, opts });
const wait = (s) => ({ cmd: 'wait', s });
const showNote = (id) => ({ cmd: 'note', id });

const Story = {
  bellCount() {
    let n = 0;
    ['glocke1', 'glocke2', 'glocke3'].forEach((b) => { if (Game.inv[b]) n++; });
    const a = Game.objState.altar;
    if (a && a.bells) n += a.bells;
    return n;
  },
  pages() { return Game.notes.filter((x) => NOTES[x].kind === 'page'); },
  objectives() {
    const f = Game.flags, inv = Game.inv, n = Game.notes, os = Game.objState;
    const L = [];
    L.push({ text: 'Finde Theo.', done: !!f.ending, main: true });
    if (!f.car_searched) L.push({ text: 'Durchsuche das Auto.', main: true });
    L.push({ text: 'Komm zum Anwesen Grauwald.' + (n.includes('n_weg') && !f.gate_open ? ' Den Torschlüssel hat der Jäger – seine Hütte liegt westlich vom Waldweg.' : ''), done: !!f.gate_open, main: true });
    if (f.gate_open) L.push({ text: 'Finde einen Weg ins Haus.' + (f.tried_front && !f.inside ? ' Vorne ist verriegelt. Vielleicht über die Küche, rechts am Haus?' : ''), done: !!f.inside, main: true });
    if (f.inside) {
      if (f.tried_tuer_keller || inv.kellerschluessel || f.visited_keller) L.push({ text: 'Finde den Kellerschlüssel.', done: !!(os.tuer_keller && os.tuer_keller.unlocked) });
      if (n.includes('n_keller') || f.visited_keller) L.push({ text: 'Stelle im Keller den Strom wieder her (2 Sicherungen).', done: !!f.power });
      if (f.tried_tuer_arbeitszimmer || n.includes('n_klavier')) L.push({ text: 'Komm ins Arbeitszimmer.' + (n.includes('n_klavier') && !f.piano_solved ? ' Das Schlaflied auf dem Klavier...' : ''), done: !!(os.tuer_arbeitszimmer && os.tuer_arbeitszimmer.unlocked) });
      if (f.saw_safe) L.push({ text: 'Öffne den Tresor (vier Ziffern).', done: !!f.safe_open });
      if (f.power && !f.attic_open && f.knows_hatch) L.push({ text: 'Öffne die Dachbodenluke im Obergeschoss.', done: !!f.attic_open });
    }
    if (f.ritual_known) {
      const b = Story.bellCount();
      L.push({ text: 'Finde die drei Glocken (' + b + '/3).', done: b >= 3, main: true });
      L.push({ text: 'Bring die Glocken auf den Altar in der Gruft unter der Kapelle.', done: !!f.ending, main: true });
    }
    const pg = Story.pages().length;
    if (pg > 0 || f.ritual_known) L.push({ text: 'Tagebuchseiten mit ihrem Namen (' + pg + '/4).', done: pg >= 4 });
    const dr = n.filter((x) => NOTES[x].kind === 'drawing').length;
    if (dr > 0) L.push({ text: 'Theos Zeichnungen (' + dr + '/6).', done: dr >= 6 });
    return L;
  },
  useItem(id) {
    const p = Game.player;
    switch (id) {
      case 'batterie':
        if (!p.hasLamp()) return { msg: 'Ich habe keine Lampe dafür.' };
        if (p.battery >= 95) return { msg: 'Die Batterie ist noch fast voll.' };
        Game.take('batterie'); p.battery = 100; p.emptyWarned = false; Sound.play('battery');
        return { msg: 'Batterie gewechselt.' };
      case 'verband':
        if (p.hp >= 100) return { msg: 'Mir fehlt nichts. Noch nicht.' };
        Game.take('verband'); p.hp = Math.min(100, p.hp + 45); Sound.play('page');
        return { msg: 'Verband angelegt. Besser.' };
      case 'tabletten':
        if (p.sanity >= 95) return { msg: 'Ich bin ruhig. Halbwegs.' };
        Game.take('tabletten'); p.sanity = Math.min(100, p.sanity + 40); Sound.play('click');
        return { msg: 'Zwei Dragees. Bitter. Es wird ruhiger.' };
      case 'notenblatt': return { note: 'n_noten' };
      case 'taschenlampe': Game.toggleFlash(); return { msg: p.flashOn ? 'Lampe an.' : 'Lampe aus.' };
      default: return { msg: 'Das kann ich hier nicht einfach benutzen.' };
    }
  },
};

// ------------------------------------------------------------
//  Allgemeine Bausteine
// ------------------------------------------------------------
function* sayAll(t, opts) {
  if (Array.isArray(t)) { for (const l of t) yield say(l, opts); } else if (t) yield say(t, opts);
}
function* readNote(o, id) {
  if (o) o.st.read = true;
  Game.addNote(id);
  yield showNote(id);
}
function* pickup(o) {
  const id = o.p.item, n = o.p.count || 1;
  o.st.taken = true;
  Game.give(id, n);
  const it = ITEMS[id];
  const ART = { taschenlampe: 'die', brecheisen: 'das', notenblatt: 'das', ventilrad: 'das', kurbel: 'die', glocke1: 'die', glocke2: 'die', glocke3: 'die' };
  if (!it.stack) yield say('Ich nehme ' + (ART[id] || 'den') + ' {y}' + it.name + '{/} an mich.');
  else UI.toast('Eingesteckt: {y}' + it.name + '{/}' + (n > 1 ? ' (' + n + ')' : ''));
}
function* warpTo(to) {
  Game.warp(to.map, to.x, to.y, to.dir);
  yield wait(0.5);
}
function defaultText(o) {
  const list = DEFAULT_TEXT[o.type];
  if (!list) return null;
  return list[Math.floor(U.hash(o.x, o.y, 4) * list.length)];
}

function* doorInteract(o) {
  const p = o.p, st = o.st;
  if (p.locked && !st.unlocked) {
    if (Game.has(p.locked)) {
      Sound.play('unlock');
      st.unlocked = true;
      Game.take(p.locked);
      yield say('Ich schließe mit dem {y}' + ITEMS[p.locked].name + '{/} auf.');
      Game.world.invalidateNav();
      if (p.to) { if (p.chainOpen) st.open = true; Sound.play('door'); yield* warpTo(p.to); return; }
      st.open = true; Sound.play('door');
      return;
    }
    Sound.play('locked');
    Game.flags['tried_' + o.id] = true;
    yield say(p.lockText || 'Abgeschlossen.');
    return;
  }
  if (p.to) {
    Sound.play('door');
    yield* warpTo(p.to);
    return;
  }
  const pl = Game.player;
  if (st.open) {
    const [x, y, w, h] = [o.x * TS, o.y * TS, TS, TS];
    if (pl.x + 4 > x && pl.x - 4 < x + w && pl.y > y - 2 && pl.y - 5 < y + h) return; // steht in der Tür
    if (Game.stalker.present(Game.world) && Math.hypot(Game.stalker.x - o.cx, Game.stalker.y - o.cy) < 14) return;
    st.open = false; Sound.play('door');
  } else {
    st.open = true; Sound.play('door');
    Game.noise(o.cx, o.cy, 70);
  }
  Game.world.invalidateNav();
}

function* guestbook(o) {
  const lines = {
    huette_gb: 'Der letzte Eintrag: »Brandt, 17.10. – Hier hört man sie nicht.«',
    gb_halle: 'Die Zeile über meiner ist in Kinderschrift: »theo«. Daneben ein Smiley.',
    gb_og: 'Eine Seite ist voll mit Strichen. Immer zehn. Dann bricht es ab.',
    gb_keller: 'Jemand hat hier unten ein Gästebuch hingelegt. Wer trägt sich im Keller ein?',
    gb_kapelle: 'Die Einträge sind alle von 1952. Lauter Namen aus dem Dorf. Alle haben gesucht.',
  };
  const first = !o.st.used;
  const c = yield ask(first ? 'Ein Gästebuch mit einer Kerze daneben. Hier fühle ich mich ein bisschen sicherer.' : 'Das Gästebuch.', ['Eintragen  (Spiel speichern)', 'Weitergehen']);
  if (c !== 0) return;
  o.st.used = true;
  Game.save();
  Sound.play('save');
  Game.player.sanity = Math.min(100, Game.player.sanity + 15);
  yield say('Ich schreibe meinen Namen ins Buch. {g}(Gespeichert){/}');
  if (first && lines[o.id]) yield say(lines[o.id]);
}

function* lightCandle(o) {
  if (!Game.has('streichhoelzer')) { yield say('Die Kerzen sind aus. Wenn ich nur Streichhölzer hätte.'); return; }
  const c = yield ask('Die Kerzen sind aus. Ein Streichholz opfern?', ['Anzünden', 'Lassen']);
  if (c !== 0) return;
  Game.take('streichhoelzer');
  Sound.play('lighter');
  o.st.lit = true;
  Game.player.sanity = Math.min(100, Game.player.sanity + 10);
  yield say('Die Flamme richtet sich auf. Licht. Wenigstens ein bisschen.');
}

// Standard-Interaktion für jedes Objekt
function* interact(o) {
  const p = o.p, st = o.st, d = o.def;
  if (p.script && Scripts[p.script]) { yield* Scripts[p.script](o); return; }
  if (d.save) { yield* guestbook(o); return; }
  if (o.type === 'door' || o.type === 'bigdoor') { yield* doorInteract(o); return; }
  if ((o.type === 'candle' || o.type === 'candles') && !OBJ.isLit(o)) { yield* lightCandle(o); return; }
  let shown = false;
  if (p.item && !st.taken) {
    if (p.text) yield* sayAll(p.text);
    yield* pickup(o);
    shown = true;
  } else if (st.taken && p.after) { yield say(p.after); shown = true; }
  else if (p.text) { yield* sayAll(p.text); shown = true; }
  if (p.note) {
    if (o.type === 'paper') st.read = true;
    yield* readNote(o, p.note);
    shown = true;
  }
  if (d.hide) {
    const c = yield ask(shown ? null : defaultText(o), [d.hide, 'Lieber nicht']);
    if (c === 0) Game.hide(o);
    return;
  }
  if (!shown) {
    const t = defaultText(o);
    if (t) yield say(t);
  }
}

// ------------------------------------------------------------
//  Einzelne Skripte
// ------------------------------------------------------------
const Scripts = {
  *car(o) {
    if (!Game.flags.car_searched) {
      yield say('Unser alter Passat. Der Motor ist tot. Nur ein Scheinwerfer flackert noch.');
      yield say('Im Handschuhfach...');
      Game.give('taschenlampe');
      Game.player.flashOn = true;
      Sound.play('flashOn');
      yield say('Papas Stablampe. Sie geht noch.  {g}[F] an / aus{/}');
      Game.give('batterie', 1);
      UI.toast('Batterie eingesteckt  ({g}[R] wechseln{/})');
      Game.flags.car_searched = true;
      yield say('Darunter ein alter Zettel von Mama.');
      yield* readNote(o, 'n_weg');
      yield say('Okay. Der Jäger. Westlich vom Weg. Und dann zu Omas Haus.');
    } else {
      const t = ['Kein Netz. Immer noch nicht.', 'Ich drehe den Schlüssel. Nichts. Nicht mal ein Klicken.', 'Auf der Rückbank liegt Theos Gameboy. Ich lasse ihn liegen. Ich bringe lieber Theo mit.'];
      yield say(t[(Game.flags.car_n = ((Game.flags.car_n || 0) + 1)) % t.length]);
    }
  },
  *roadWest() {
    if (Game.flags.road_west) return;
    Game.flags.road_west = true;
    yield say('Hinter mir: nur Straße, Nebel und zwölf Kilometer bis zum nächsten Dorf.');
    yield say('Nein. Theo ist hier irgendwo.');
  },
  *gateWald(o) {
    if (o.st.unlocked) { Sound.play('door'); yield* warpTo({ map: 'hof', x: 27, y: 39, dir: 'up' }); return; }
    if (Game.has('torschluessel')) {
      Game.take('torschluessel');
      Sound.play('unlock');
      o.st.unlocked = true;
      Game.flags.gate_open = true;
      yield say('Das Schloss ist rostig, aber der Schlüssel dreht sich. Die Kette rasselt zu Boden.');
      Sound.play('door');
      yield* warpTo({ map: 'hof', x: 27, y: 39, dir: 'up' });
      return;
    }
    Sound.play('locked');

    if (theo) theo.st.visible = true;
    yield say('Und hinter dem Altar, zusammengerollt auf dem Steinboden, schläft Theo.');
    s.count = 93;
    yield say('{s}»...dreiundneunzig... vierundneunzig...«{/}');
    const pages = Story.pages();
    const letters = pages.map((p) => NOTES[p].letter).sort((a, b) => 'ILSE'.indexOf(a) - 'ILSE'.indexOf(b));
    for (;;) {
      const c = yield ask('Was tue ich?', ['Ihren Namen rufen', 'Bis hundert warten und läuten', 'Theo packen und rennen'], { cancel: -1 });
      if (c === 0) {
        if (pages.length < 4) {
          yield say(letters.length ? 'Ich kenne nur Bruchstücke: ' + letters.join(' · ') + ' ... Das reicht nicht. Ein falscher Name ist schlimmer als keiner.' : 'Ich kenne ihren Namen nicht. Niemand hat ihn mir gesagt.');
          continue;

        yield* Scripts.endGood();
        return;
      }
      if (c === 1) { yield* Scripts.endRing(); return; }
      yield* Scripts.endFlee();
      return;
    }
  },
  *endGood() {
    const s = Game.stalker;
    yield say('Ich hole Luft. Vier Buchstaben. Vier Seiten. Siebzig Jahre.');
    yield say('»{y}ILSE.{/}«');
    s.count = 101;
    Game.flash('#ffffff', 1.2);
    Sound.play('bell', 330);
    yield wait(1.5);
    Game.startEnding('good');
  },
  *endRing() {
    const s = Game.stalker;
    for (let n = 95; n <= 100; n++) { s.count = n; Game.fxText(s.x, s.y - 40, U.numWord(n) + (n < 100 ? '...' : '.'), n === 100 ? C.rd4 : C.bn1, 1.4); Sound.play('count', n); yield wait(0.9); }
    yield say('Hundert.');
    [330, 390, 440].forEach((f, i) => setTimeout(() => Sound.play('bell', f), i * 450));
    Game.flash('#d8d0c0', 1.5);
    yield wait(2);
    Game.startEnding('ring');
  },
  *endFlee() {
    yield say('Ich packe Theo unter den Armen. Er ist so leicht. Ich renne.');
    Sound.play('scream');
    Game.shake(4, 1.2);
    yield wait(1.4);
    Game.startEnding('flee');
  },
};
